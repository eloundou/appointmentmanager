spring.application.name=appointmentmanager

#spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://localhost:5432/<nom_de_la_base>
spring.datasource.username=<utilisateur>
spring.datasource.password=<mot_de_passe>

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.format-sql=true


# Good practice to prevent accidental wipes in production environments
spring.flyway.clean-disabled=true
# Allows developers to out-of-order merge migrations during teamwork
spring.flyway.out-of-order=true

#spring.mvc.problemdetails.enabled=true